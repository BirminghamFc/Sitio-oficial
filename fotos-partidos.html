<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fotografías | Birmingham FC</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f7f7f8;
    color:#111;
}

a{
    text-decoration:none;
    color:inherit;
}

/* HEADER */

.header{
    height:72px;
    background:#fff;
    border-bottom:1px solid #e9e9e9;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:1000;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:43px;
    height:43px;
    object-fit:contain;
}

.brand span{
    font-size:14px;
    font-weight:800;
    letter-spacing:.5px;
}

.nav{
    display:flex;
    align-items:center;
    gap:5px;
}

.nav a{
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    color:#444;
}

.nav a:hover{
    background:#f4f4f4;
}

.nav .active{
    background:#e71937;
    color:white;
}

/* CONTENIDO */

.container{
    width:88%;
    max-width:1000px;
    margin:auto;
}

.section{
    padding:70px 0;
}

.section-title{
    margin-bottom:30px;
}

.section-title h1{
    font-size:32px;
    font-weight:900;
    margin-bottom:8px;
}

.section-title p{
    font-size:13px;
    color:#888;
}

/* GALERÍA */

.gallery-empty{
    background:white;
    border:1px solid #e7e7e7;
    border-radius:20px;
    padding:60px 25px;
    text-align:center;
}

.gallery-icon{
    font-size:45px;
    margin-bottom:20px;
}

.gallery-empty h2{
    font-size:20px;
    margin-bottom:10px;
}

.gallery-empty p{
    color:#888;
    font-size:13px;
}

/* VOLVER */

.back{
    display:inline-block;
    margin-top:25px;
    padding:11px 20px;
    border-radius:22px;
    background:#e71937;
    color:white;
    font-size:12px;
    font-weight:700;
}

/* FOOTER */

footer{
    background:#050505;
    color:white;
    text-align:center;
    padding:45px 20px 25px;
    margin-top:40px;
}

.footer-shield{
    width:60px;
    height:60px;
    margin:0 auto 15px;
}

.footer-shield img{
    width:100%;
    height:100%;
    object-fit:contain;
}

footer h2{
    font-size:18px;
    margin-bottom:6px;
}

footer p{
    color:#888;
    font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

    .header{
        height:auto;
        padding:13px 18px;
        flex-direction:column;
        gap:10px;
    }

    .nav{
        width:100%;
        flex-wrap:wrap;
        justify-content:center;
        gap:4px;
    }

    .nav a{
        padding:8px 11px;
        font-size:12px;
    }

    .container{
        width:92%;
    }

}

</style>

</head>

<body>

<header class="header">

<a href="index.html" class="brand">

<img src="escudo.png" alt="Birmingham FC">

<span>BIRMINGHAM FC</span>

</a>

<nav class="nav">

<a href="index.html">Inicio</a>

<a href="partidos.html">Próximo partido</a>

<a href="novedades.html">Novedades</a>

<a href="club.html">Club</a>

</nav>

</header>

<section class="section">

<div class="container">

<div class="section-title">

<h1>Fotografías — Partidos</h1>

<p>Imágenes de los partidos disputados por Birmingham FC.</p>

</div>

<div class="gallery-empty">

<div class="gallery-icon">📷</div>

<h2>Próximamente</h2>

<p>Aún no hay fotografías de partidos cargadas.</p>

<a href="fotos.html" class="back">← Volver a Fotografías</a>

</div>

</div>

</section>

<footer>

<div class="footer-shield">

<img src="escudo.png" alt="Birmingham FC">

</div>

<h2>BIRMINGHAM FC</h2>

<p>Pasión roja y blanca, partido a partido.</p>

</footer>

</body>

</html>
